<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#07111f">
  <title>SV Private Access</title>
  <style>
    :root{--bg:#06101d;--panel:#0d1b2d;--line:#263a52;--text:#eef4fb;--muted:#95a9bf;--gold:#f4b400}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,#17345a 0,transparent 34%),linear-gradient(135deg,#06101d,#0b1b2f);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .card{width:min(460px,100%);padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(13,27,45,.97);box-shadow:0 30px 90px #0008}
    .mark{width:62px;height:62px;display:grid;place-items:center;border:2px solid var(--gold);border-radius:18px;color:var(--gold);font-size:21px;font-weight:950;letter-spacing:-.08em;box-shadow:inset 0 0 0 5px rgba(244,180,0,.08)}
    .eyebrow{display:block;margin-top:24px;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.16em}.card h1{margin:8px 0 10px;font-size:31px;letter-spacing:-.04em}.card p{margin:0;color:var(--muted);line-height:1.7}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:24px;padding:14px 18px;border:0;border-radius:12px;background:var(--gold);color:#171208;text-decoration:none;font-weight:900;box-shadow:0 12px 30px rgba(244,180,0,.18)}
    .note{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}.back{display:block;margin-top:16px;text-align:center;color:#b8c7d8;text-decoration:none;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">SV</div>
    <span class="eyebrow">PRIVATE ADMINISTRATION</span>
    <h1>Secure portfolio access</h1>
    <p>Continue with the authorized GitHub account to open the private enquiry dashboard.</p>
    <a class="btn" href="https://sp-portfolio-api.spverma135.workers.dev/admin/">Continue securely</a>
    <div class="note">Access is restricted to the approved GitHub account. Unauthorized accounts cannot open the dashboard.</div>
    <a class="back" href="../">Return to portfolio</a>
  </main>
</body>
</html>
