<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">SV gold circle monogram</title>
  <desc id="desc">Elegant gold SV serif monogram inside a circular gold ring on black.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.2" stop-color="#ffd66a"/>
      <stop offset="0.52" stop-color="#e8a52b"/>
      <stop offset="0.78" stop-color="#a85b10"/>
      <stop offset="1" stop-color="#ffd36a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7c7"/>
      <stop offset="0.45" stop-color="#efb23d"/>
      <stop offset="1" stop-color="#9c4e0d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="124" fill="#070707"/>
  <circle cx="128" cy="128" r="111" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="128" cy="128" r="106" fill="none" stroke="#6f3608" stroke-width="1" opacity="0.8"/>
  <g filter="url(#shadow)" fill="url(#shine)">
    <text x="37" y="187" font-family="Georgia, 'Times New Roman', serif" font-size="151" font-style="italic" font-weight="500" letter-spacing="-14">S</text>
    <text x="112" y="194" font-family="Georgia, 'Times New Roman', serif" font-size="139" font-style="italic" font-weight="500" letter-spacing="-8">V</text>
  </g>
  <path d="M64 155 C91 178,108 186,132 193" fill="none" stroke="#f7c458" stroke-width="2" opacity="0.75"/>
</svg>
